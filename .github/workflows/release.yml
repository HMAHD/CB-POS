name: Build & Release

# Trigger: push a version tag to the private repo.
# Example:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Re-verify the exact commit being released -- a tag push previously
  #    went straight to building/publishing with no automated check that
  #    the tagged commit's tests actually pass.
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install Qt system libraries (headless PyQt6 tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            x11-utils

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -q --cov=cbpos --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────
  # 2. Build Windows executable + Inno Setup installer
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.version.outputs.installer_name }}
      sha256: ${{ steps.hash.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "installer_name=CBPOSSetup-$VER.exe" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group build

      - name: Stamp version in Config
        shell: python
        run: |
          import re, pathlib
          cfg = pathlib.Path("cbpos/config.py")
          text = cfg.read_text()
          text = re.sub(
              r'VERSION\s*=\s*"[^"]*"',
              'VERSION = "${{ steps.version.outputs.version }}"',
              text,
          )
          cfg.write_text(text)
          print(f"Stamped version: ${{ steps.version.outputs.version }}")

      - name: Build executable with PyInstaller
        run: uv run pyinstaller cbpos.spec

      - name: Verify build output
        shell: bash
        run: |
          ls -la dist/cbpos/cbpos.exe
          echo "Exe size: $(stat -c%s dist/cbpos/cbpos.exe 2>/dev/null || stat -f%z dist/cbpos/cbpos.exe) bytes"
          echo "Total files: $(find dist/cbpos -type f | wc -l)"

      # The frozen exe must be able to migrate an older database to head --
      # alembic/ ships as data, so a missing hidden import only shows up here (#630).
      - name: Smoke-test DB migration in the frozen exe
        shell: bash
        run: |
          export CBPOS_DB="$RUNNER_TEMP/appdata/CB POS/cbpos.db"
          uv run --no-sync python - <<'EOF'
          import os
          from pathlib import Path
          from alembic import command
          from alembic.config import Config
          from sqlalchemy import create_engine
          from cbpos.core.models import Base
          db = Path(os.environ["CBPOS_DB"])
          db.parent.mkdir(parents=True)
          uri = f"sqlite:///{db}"
          Base.metadata.create_all(create_engine(uri))
          # Real previous schema: stamp head, then run the head migration's downgrade.
          cfg = Config("alembic.ini")
          cfg.set_main_option("sqlalchemy.url", uri)
          cfg.attributes["configure_logger"] = False
          command.stamp(cfg, "head")
          command.downgrade(cfg, "-1")
          print("Fixture DB downgraded one revision from head")
          EOF
          LOCALAPPDATA="$RUNNER_TEMP/appdata" ./dist/cbpos/cbpos.exe --migrate-only
          uv run --no-sync python - <<'EOF'
          import os, sqlite3, sys
          from alembic.script import ScriptDirectory
          head = ScriptDirectory("alembic").get_current_head()
          with sqlite3.connect(os.environ["CBPOS_DB"]) as conn:
              (current,) = conn.execute("SELECT version_num FROM alembic_version").fetchone()
          print(f"alembic_version={current} head={head}")
          sys.exit(current != head)
          EOF

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: installer/cbpos.iss
          options: /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Compute SHA-256
        id: hash
        shell: bash
        run: |
          INSTALLER="dist/installer/${{ steps.version.outputs.installer_name }}"
          SHA=$(sha256sum "$INSTALLER" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/installer/${{ steps.version.outputs.installer_name }}
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────
  # 3. Publish to the PUBLIC releases repo (ceybyte/cbpos-releases)
  #
  #    Order matters here: the GitHub Release (with the actual installer
  #    asset) is created BEFORE latest.json is updated and pushed. Doing
  #    it the other way around -- as this previously did -- means that if
  #    "Create GitHub Release" ever fails after latest.json already went
  #    live, every running app's auto-updater would advertise a new
  #    version whose download URL 404s. This order fails safe: if release
  #    creation fails, latest.json (and therefore the live update check)
  #    never changes.
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Releases Repo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v7
        with:
          name: installer
          path: ./dist

      - name: Clone releases repo
        run: |
          git clone https://x-access-token:${{ secrets.RELEASES_PAT }}@github.com/ceybyte/cbpos-releases.git releases-repo

      - name: Extract Changelog Section
        id: changelog
        shell: bash
        run: |
          if ! python scripts/changelog_section.py "${{ needs.build.outputs.version }}" > changelog.txt || [ ! -s changelog.txt ]; then
            echo "Release notes for version ${{ needs.build.outputs.version }}" > changelog.txt
          fi

      - name: Create GitHub Release on releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          cd releases-repo
          gh release create "v${{ needs.build.outputs.version }}" \
            --title "CB POS v${{ needs.build.outputs.version }}" \
            --notes-file ../changelog.txt \
            ../dist/${{ needs.build.outputs.installer_name }}

      - name: Generate latest.json
        shell: bash
        run: |
          python -c '
          import json, sys
          with open("changelog.txt", encoding="utf-8") as f:
              notes = f.read().strip()
          version = sys.argv[1]
          installer_name = sys.argv[2]
          sha256 = sys.argv[3]
          date_str = sys.argv[4]
          manifest = {
              "version": version,
              "release_date": date_str,
              "download_url": f"https://github.com/ceybyte/cbpos-releases/releases/download/v{version}/{installer_name}",
              "changelog": notes,
              "min_version": "1.0.0",
              "sha256": sha256
          }
          with open("latest.json", "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=4)
          ' "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.installer_name }}" "${{ needs.build.outputs.sha256 }}" "$(date -u +%Y-%m-%d)"
          echo "Generated latest.json:"
          cat latest.json

      - name: Update latest.json in releases repo
        run: |
          cp latest.json releases-repo/latest.json
          cd releases-repo
          git config user.name "CB POS Bot"
          git config user.email "bot@ceybyte.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Update latest.json to v${{ needs.build.outputs.version }}"
          git push
