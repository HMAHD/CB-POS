[project]
name = "cbpos"
version = "1.3.0"
description = "CB POS — industrial-grade Point of Sale system for Sri Lankan retail markets"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "PyQt6>=6.7.0",
    "SQLAlchemy>=2.0.54",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.7.0",
    "python-escpos>=3.1",
    "pyusb>=1.3.1",
    "alembic>=1.20.0",
    "qtawesome>=1.3.0",
    "python-barcode>=0.16.1",
    "qrcode>=8.2",
    "Pillow>=12.3.0",
    "reportlab>=4.4.10",
    "pandas>=3.0.3",
    "xlsxwriter>=3.2.9",
    "openpyxl>=3.1.0",
    "xhtml2pdf>=0.2.20",
    "pyzipper>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
    "pre-commit>=4.6.2",
    "sphinx",
    "myst-parser",
]
build = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# CB-POS is a shipped desktop application, not an installable library -
# don't build/install it into its own environment.
package = false

[tool.ruff]
# Match current project settings
line-length = 120
target-version = "py312"

# Exclude directories from linting and formatting
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__pycache__",
    "docs/source/conf.py",
    "old",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort — import sorting
    "UP",    # pyupgrade — modernize syntax for Python 3.12+
    "B",     # flake8-bugbear — catches common bugs & design issues
    "C4",    # flake8-comprehensions — better list/dict/set comprehensions
    "SIM",   # flake8-simplify — simplify code
    "PIE",   # flake8-pie — misc lint improvements
    "RUF",   # Ruff-specific rules
    "T20",   # flake8-print — catches stray print() calls (use logger instead)
    "D101",  # pydocstyle — undocumented public class
    "D102",  # pydocstyle — undocumented public method
    "D103",  # pydocstyle — undocumented public function
]

ignore = [
    "E203",   # Whitespace before ':' — conflicts with Black-style formatting
    "E501",   # Line too long — handled by formatter
    "B008",   # Function call in default argument — common in PyQt signal/slot patterns
    "B904",   # raise-without-from — existing pattern, refactor gradually
    "SIM102", # Collapsible if — readability preference, nested ifs can be clearer
    "SIM105", # Use contextlib.suppress — existing try/except/pass pattern, refactor gradually
    "SIM108", # Use ternary operator — readability preference, not always clearer
    "SIM115", # Use context manager for open() — existing pattern
    "SIM117", # Multiple with statements — existing pattern, refactor gradually
    "UP007",  # Use X | Y for union type — keep Optional[] for clarity
    "UP031",  # printf-string-formatting — existing %-format strings, refactor gradually
    "RUF012", # Mutable class variables — too noisy with PyQt class attributes
    "RUF013", # Implicit Optional — changing signatures in bulk is risky, fix gradually
]

[tool.ruff.lint.per-file-ignores]
# Match original .flake8 per-file-ignores
"cbpos/ui/views/history_view.py" = ["E221", "E222", "E231", "E702"]
"scripts/seed.py" = ["E231", "T20"]
# Test files can use print and assert. Docstrings aren't required here either:
# test names are self-documenting, unlike application code.
"tests/**" = ["T20", "D101", "D102", "D103"]
"cbpos/tests/**" = ["D101", "D102", "D103"]
# Scripts can use print; docstrings aren't required for informal dev tools.
"scripts/**" = ["T20", "D101", "D102", "D103"]
# Main entry point has legitimate startup prints
"main.py" = ["T20"]
# Infrastructure/hardware drivers may use print for debug
"cbpos/infrastructure/**" = ["T20"]
# Build script uses print for CLI output
"create_installer.py" = ["T20", "D103"]
# Auto-generated boilerplate, never hand-documented
"alembic/versions/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["cbpos"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"