name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'cbpos/**/*.py'
      - '.github/workflows/docs.yml'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen  # PyQt6 modules are imported by autodoc

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Generate API documentation
      run: uv run sphinx-apidoc -f -o docs/api cbpos --separate --module-first

    - name: Build documentation
      run: uv run sphinx-build -b html docs docs/_build/html

    # CB-POS is closed-source: not published to GitHub Pages (which is
    # public). Built docs are uploaded as a private CI artifact instead --
    # downloadable by repo collaborators, catches broken docs on every
    # push, nothing goes public. Re-add a "Deploy to GitHub Pages" step
    # (see git history before this comment) if the project ever open-sources.
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: sphinx-docs
        path: docs/_build/html
        retention-days: 14
